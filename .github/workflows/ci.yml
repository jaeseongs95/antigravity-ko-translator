name: CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feature/**', 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop, 'fix/**', 'feature/**', 'release/**', 'hotfix/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and contract tests
        run: node --test test/ko-translator.test.js
