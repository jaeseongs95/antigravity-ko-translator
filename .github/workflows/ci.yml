name: CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feature/**', 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop, 'fix/**', 'feature/**', 'release/**', 'hotfix/**']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout antigravity-ko-translator
        uses: actions/checkout@v4
        with:
          path: ko-thought-translator
      - name: Checkout sibling antigravity-statusbar (real companion bundle)
        uses: actions/checkout@v4
        with:
          repository: jaeseongs95/antigravity-statusbar
          ref: develop
          path: antigravity-statusbar
      - name: Checkout sibling antigravity-mcp-manager (real companion bundle)
        uses: actions/checkout@v4
        with:
          repository: jaeseongs95/antigravity-mcp-manager
          ref: develop
          path: antigravity-mcp-manager
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic bundle parity and run unit & real Chromium CDP E2E suites
        working-directory: ko-thought-translator
        run: npm test
